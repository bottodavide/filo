# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filo"
version = "0.0.1"
description = "Chain walker for AI artifact provenance and declared licenses on Hugging Face; emits CycloneDX AIBOM. States facts, does not qualify."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Davide Botto" }]
keywords = ["aibom", "cyclonedx", "sbom", "licenses", "provenance", "huggingface"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "huggingface_hub>=0.24",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "referencing>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
filo = "filo.cli:main"

[project.urls]
Homepage = "https://github.com/bottodavide/filo"
Repository = "https://github.com/bottodavide/filo"

[tool.hatch.build.targets.wheel]
packages = ["src/filo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# --strict enforced in CI on the modules that produce deliverables:
files = ["src/filo/ir.py", "src/filo/evidence.py"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
